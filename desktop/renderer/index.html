<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>学习桌面</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <div id="xdc-glass">
    <div class="xdc-window" data-window aria-label="学习桌面">
      <header class="window-head">
        <button class="tool back" type="button" data-action="back" aria-label="返回" title="返回" hidden><span aria-hidden="true">‹</span></button>
        <div class="window-tools">
          <button class="tool" type="button" data-action="refresh" aria-label="刷新" title="刷新"><span aria-hidden="true">↻</span></button>
          <button class="tool" type="button" data-action="settings" aria-label="设置" title="设置"><span aria-hidden="true">⚙</span></button>
        </div>
      </header>
      <main class="window-content" data-content aria-live="polite"></main>
      <nav class="dock" aria-label="主导航">
        <button type="button" data-nav="overview" aria-label="总览" aria-current="page"><span class="nav-fallback" aria-hidden="true">⌂</span><span class="nav-label">总览</span></button>
        <button type="button" data-nav="courses" aria-label="我的课程"><span class="nav-fallback" aria-hidden="true">▥</span><span class="nav-label">我的课程</span></button>
        <button type="button" data-nav="downloads" aria-label="下载记录"><span class="nav-fallback" aria-hidden="true">↓</span><span class="nav-label">下载记录</span></button>
      </nav>
      <div class="notice" data-notice role="status" hidden></div>
      <dialog class="popover-layer" data-popover aria-labelledby="accent-picker-title">
        <div class="picker">
          <h4 id="accent-picker-title">自定义强调色 <span>Esc 或右键取消</span></h4>
          <div class="sv" data-drag="sv" aria-hidden="true"><span class="knob"></span></div>
          <div class="hue" data-drag="hue" aria-hidden="true"><span class="knob"></span></div>
          <div class="nums">
            <label>色相<input data-hsv="0" type="number" min="0" max="360"></label>
            <label>饱和度<input data-hsv="1" type="number" min="0" max="100"></label>
            <label>明度<input data-hsv="2" type="number" min="0" max="100"></label>
            <label>HEX<input data-phex type="text" maxlength="7" spellcheck="false" autofocus></label>
          </div>
          <p class="error" data-picker-error role="status" hidden></p>
          <div class="picker-actions">
            <span class="preview-chip" aria-hidden="true"></span>
            <button type="button" class="press" data-eyedrop>吸管</button>
            <span class="grow"></span>
            <button type="button" class="press" data-picker-close>取消</button>
            <button type="button" class="press primary" data-picker-close="keep">确定</button>
          </div>
        </div>
      </dialog>
    </div>
  </div>
</body>
</html>
