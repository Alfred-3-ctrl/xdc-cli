name: Windows release artifacts

on:
  workflow_dispatch:
    inputs:
      sign:
        description: Request SignPath release signing (requires approval)
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      apphost-artifact-id: ${{ steps.upload-apphost.outputs.artifact-id }}
      product-name: ${{ steps.stage.outputs.product-name }}
      product-version: ${{ steps.stage.outputs.product-version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.404'
      - name: Test
        shell: pwsh
        run: |
          npm.cmd ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm.cmd test
      - name: Stage Windows release
        id: stage
        shell: pwsh
        run: |
          try {
            $result = & ./.github/scripts/Stage-WindowsRelease.ps1 -OutputDirectory (Join-Path $env:RUNNER_TEMP 'xdc-release')
          } catch {
            $message = $_.Exception.Message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows staging failed::$message"
            throw
          }
          "bundle-directory=$($result.BundleDirectory)" >> $env:GITHUB_OUTPUT
          "unsigned-apphost=$($result.UnsignedAppHost)" >> $env:GITHUB_OUTPUT
          "product-name=$($result.ProductName)" >> $env:GITHUB_OUTPUT
          "product-version=$($result.ProductVersion)" >> $env:GITHUB_OUTPUT
      - name: Upload staging ZIP and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-windows-bundle
          path: ${{ steps.stage.outputs.bundle-directory }}
          if-no-files-found: error
          retention-days: 7
      - name: Upload only the apphost for signing
        if: inputs.sign
        id: upload-apphost
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-windows-apphost
          path: ${{ steps.stage.outputs.unsigned-apphost }}
          if-no-files-found: error
          retention-days: 7

  sign:
    if: inputs.sign
    needs: build
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check SignPath configuration
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
        run: |
          $required = 'SIGNPATH_API_TOKEN', 'SIGNPATH_ORGANIZATION_ID', 'SIGNPATH_PROJECT_SLUG',
            'SIGNPATH_SIGNING_POLICY_SLUG', 'SIGNPATH_ARTIFACT_CONFIGURATION_SLUG'
          $missing = @($required | Where-Object { -not [Environment]::GetEnvironmentVariable($_) })
          if ($missing.Count) { throw "Missing SignPath configuration: $($missing -join ', ')" }
      - name: Download staging ZIP
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: unsigned-windows-bundle
          path: ${{ runner.temp }}/xdc-unsigned
      - name: Submit apphost for release signing
        uses: signpath/github-action-submit-signing-request@a2c5b60d9c75f073142b653c354b632eedce097b # v3.2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ needs.build.outputs.apphost-artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: ${{ runner.temp }}/xdc-signed-apphost
          parameters: |
            productName: ${{ toJSON(needs.build.outputs.product-name) }}
            productVersion: ${{ toJSON(needs.build.outputs.product-version) }}
      - name: Verify signature and finish the ZIP
        shell: pwsh
        run: |
          $archives = @(Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP 'xdc-unsigned') -Filter '*.zip' -File)
          if ($archives.Count -ne 1) { throw 'Expected one staged Windows ZIP.' }
          $checksum = Get-Content -LiteralPath "$($archives[0].FullName).sha256" -Raw
          $expected = ($checksum.Trim() -split '\s+', 2)[0]
          if ($expected -notmatch '^[a-fA-F0-9]{64}$' -or (Get-FileHash -LiteralPath $archives[0].FullName).Hash -ne $expected) {
            throw 'The downloaded staging ZIP failed its SHA-256 check.'
          }
          $expanded = Join-Path $env:RUNNER_TEMP 'xdc-expanded'
          Expand-Archive -LiteralPath $archives[0].FullName -DestinationPath $expanded
          $bundle = Join-Path $expanded $archives[0].BaseName
          $signed = Join-Path $env:RUNNER_TEMP 'xdc-signed-apphost/Xdc.NativeDesktop.exe'
          & ./.github/scripts/Complete-WindowsRelease.ps1 -StagedBundle $bundle -SignedAppHost $signed `
            -OutputDirectory (Join-Path $env:RUNNER_TEMP 'xdc-signed-bundle')
      - name: Upload signed ZIP and checksum for acceptance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-windows-bundle
          path: ${{ runner.temp }}/xdc-signed-bundle/
          if-no-files-found: error
          retention-days: 14
